name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # No test step: this repo has no tests.
      # No build step: `build` is `echo "No build step."` — Vercel builds it.
      # No format step: `prettier --check` currently fails on 19 files. Gating on
      # it here would bury a CI addition under a tree-wide reformat.
