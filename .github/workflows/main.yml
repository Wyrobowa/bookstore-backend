name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # No typecheck step: `npm run typecheck` fails on a clean install with
      # "Cannot find name 'process'/'Buffer'". @types/node is not a direct
      # devDependency — only a nested transitive one, where TypeScript's
      # automatic @types inclusion does not find it. Reproduced with `npm ci`
      # locally, not just in CI. Adding the dep is its own change.
      # No test step: this repo has no tests.
      # No build step: `build` is `echo "No build step."` — Vercel builds it.
      # No format step: `prettier --check` fails on 19 files. Gating on it here
      # would bury a CI addition under a tree-wide reformat.
